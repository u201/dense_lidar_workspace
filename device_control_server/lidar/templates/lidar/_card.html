{# 卡片外壳：门户 include 它；永不整体替换，只有 #lidar-body 会被片段刷新 #}
<section class="card" id="lidar-card"
         hx-get="{% url 'lidar:card' %}"
         hx-trigger="lidar-refresh from:body"
         hx-target="#lidar-body"
         hx-swap="innerHTML">
  <header class="card-header">
    <h2>Lidar</h2>
    <button class="op"
            hx-get="{% url 'lidar:card' %}"
            hx-target="#lidar-body"
            hx-swap="innerHTML"
            hx-disabled-elt="this">刷新</button>
  </header>
  <div id="lidar-body">
    {% include "lidar/_card_body.html" %}
  </div>
</section>
