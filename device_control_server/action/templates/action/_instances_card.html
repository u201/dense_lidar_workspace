{# 执行状态卡片外壳：action 独立页与门户共用；轮询只替换 #instances-live #}
<section class="card" id="instances-card">
  <header class="card-header">
    <h2>执行状态</h2>
    <button class="op"
            hx-get="{% url 'action:instances' %}"
            hx-target="#instances-body"
            hx-swap="innerHTML"
            hx-disabled-elt="this">刷新</button>
  </header>
  <div id="instances-body">
    {% include "action/_instances.html" %}
  </div>
</section>
